apiVersion: smoothnas.io/v1
kind: Plugin
metadata:
  name: llama-cpp
  version: 0.7.6
  description: >
    llama.cpp inference server, CPU only, with Gemma4 MTP and

    TurboQuant KV cache support for quick experiments before selecting a GPU
    variant.
  vendor: smoothnas
  homepage: https://github.com/RakuenSoftware/smoothnas-plugin-llama-cpp
artifact:
  type: oci-image
  image: ghcr.io/rakuensoftware/smoothnas-plugin-llama-cpp:0.1.0-cpu
container:
  command:
    - '--temp'
    - ${LLAMA_ARG_TEMP}
    - '--ctx-size'
    - ${CTX_SIZE}
    - '--parallel'
    - ${PARALLEL_SLOTS}
    - '--reasoning-format'
    - ${LLAMA_ARG_REASONING_FORMAT}
    - '--threads'
    - ${THREADS}
  restartPolicy: unless-stopped
  resources:
    memory: ${MEMORY_LIMIT}
volumes:
  - name: models
    mode: tier-bound
    slot: SSD
    minSize: 30G
    bind: /models
ports:
  - name: http
    port: 8080
    protocol: tcp
    expose: true
ui:
  embed:
    path: /
    auth: bearer-injected
profiles:
  - default-limits
config:
  - key: MODEL_URL
    type: string
    label: Model download URL
    default: ''
    description: |
      HTTP(S) URL for the GGUF model this one-model container should run.
      On start, the wrapper downloads this URL into /models/model.gguf
      inside the container, replacing the prior model when the URL changes.
  - key: LLAMA_ARG_TEMP
    type: number
    label: Temperature
    default: '0.8'
    min: '0'
    max: '2'
    step: '0.01'
    description: >-
      Sampling temperature passed to llama.cpp. Lower values are more
      deterministic.
  - key: CTX_SIZE
    type: number
    label: Context window
    default: '32768'
    min: '1024'
    step: '1024'
    unit: tokens
    description: >-
      Total server context in tokens. Increase after confirming the selected
      model fits without exhausting host memory.
  - key: PARALLEL_SLOTS
    type: number
    label: Request slots
    default: '1'
    min: '1'
    max: '16'
    step: '1'
    description: llama.cpp parallel request slots passed to --parallel.
  - key: MEMORY_LIMIT
    type: string
    label: Container memory
    default: 32GiB
    description: LXC memory limit for the llama.cpp container.
  - key: LLAMA_ARG_FLASH_ATTN
    type: select
    label: Flash attention
    default: 'on'
    options:
      - value: 'on'
      - value: 'off'
    description: Enables llama.cpp flash attention.
  - key: LLAMA_ARG_CACHE_TYPE_K
    type: select
    label: K cache type
    default: turbo3
    options:
      - value: turbo3
      - value: turbo4
      - value: turbo2
      - value: q8_0
      - value: q5_0
      - value: q4_0
    description: >-
      KV cache K quantization. TurboQuant values require the bundled Atomic
      llama.cpp fork.
  - key: LLAMA_ARG_CACHE_TYPE_V
    type: select
    label: V cache type
    default: turbo3
    options:
      - value: turbo3
      - value: turbo4
      - value: turbo2
      - value: q8_0
      - value: q5_0
      - value: q4_0
    description: >-
      KV cache V quantization. TurboQuant values require the bundled Atomic
      llama.cpp fork.
  - key: LLAMA_ARG_REASONING_FORMAT
    type: select
    label: Reasoning output format
    default: auto
    options:
      - value: auto
      - value: none
      - value: deepseek
      - value: deepseek-legacy
    description: >-
      Controls llama.cpp reasoning extraction. Use none to keep thinking in
      message.content instead of emitting message.reasoning_content.
  - key: SPECULATIVE_MODE
    type: select
    label: Speculative decoding
    default: none
    options:
      - value: none
      - value: mtp
      - value: draft
      - value: nextn
    description: >-
      Enables llama.cpp speculative decoding. Use mtp for Gemma4 assistant
      drafting with an MTP head GGUF, or nextn for Qwen3.6 built-in MTP heads.
  - key: SPEC_DRAFT_MODEL_PATH
    type: string
    label: MTP head GGUF path
    default: ''
    description: >-
      Gemma4 assistant GGUF path inside the container. With SPECULATIVE_MODE=mtp
      this is passed as --mtp-head. With SPECULATIVE_MODE=nextn, set this to
      /models/model.gguf for combined Qwen3.6 MTP GGUFs.
  - key: SPEC_DRAFT_MODEL_URL
    type: string
    label: MTP head download URL
    default: ''
    description: >-
      Optional HTTP(S) URL for the Gemma4 assistant GGUF. When set, the wrapper
      downloads it before startup and uses it as the --mtp-head model.
  - key: SPEC_DRAFT_BLOCK_SIZE
    type: number
    label: Draft block size
    default: '3'
    min: '2'
    step: '1'
    description: Gemma4 MTP draft block size passed to --draft-block-size.
  - key: SPEC_DRAFT_MAX_TOKENS
    type: number
    label: Draft max tokens
    default: '8'
    min: '1'
    step: '1'
    description: Maximum number of draft tokens proposed during speculative decoding.
  - key: SPEC_DRAFT_N_MAX
    type: number
    label: Built-in MTP heads
    default: '3'
    min: '1'
    step: '1'
    description: Number of built-in MTP/NextN draft heads passed to --spec-draft-n-max.
  - key: SPEC_DRAFT_MIN_TOKENS
    type: number
    label: Draft min tokens
    default: '0'
    min: '0'
    step: '1'
    description: Minimum number of draft tokens used during speculative decoding.
  - key: SPEC_DRAFT_P_MIN
    type: number
    label: Draft probability floor
    default: '0.75'
    min: '0'
    max: '1'
    step: '0.01'
    description: Minimum speculative decoding probability passed to --spec-draft-p-min.
  - key: SPEC_DRAFT_P_SPLIT
    type: number
    label: Draft split probability
    default: '0.10'
    min: '0'
    max: '1'
    step: '0.01'
    description: Speculative decoding split probability passed to --spec-draft-p-split.
  - key: SPEC_DRAFT_CACHE_TYPE_K
    type: select
    label: Draft K cache type
    default: turbo3
    options:
      - value: turbo3
      - value: turbo4
      - value: turbo2
      - value: q8_0
      - value: q5_0
      - value: q4_0
    description: KV cache K quantization for the draft/MTP model.
  - key: SPEC_DRAFT_CACHE_TYPE_V
    type: select
    label: Draft V cache type
    default: turbo3
    options:
      - value: turbo3
      - value: turbo4
      - value: turbo2
      - value: q8_0
      - value: q5_0
      - value: q4_0
    description: KV cache V quantization for the draft/MTP model.
  - key: THREADS
    type: number
    label: CPU threads
    default: '0'
    min: '0'
    step: '1'
    description: CPU threads. 0 = let llama.cpp auto-detect.
  - key: SMOOTHNAS_BEARER_EXPECTED
    type: string
    secret: true
    description: Auto-populated by SmoothNAS; do not edit manually.
