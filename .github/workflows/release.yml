name: release

# Builds + publishes plugin variants on tag push.
# Tag format is plain semver: v0.1.0, v0.1.1, v1.0.0-rc1, etc.
#
# Each variant is built with the local Docker-compatible daemon, saved as an
# image archive, and pushed to GHCR with crane. The pushed-image digest is
# spliced into the matching manifest's artifact.image before the manifests are
# attached to the GitHub release. Operators downloading the manifests get a
# digest-pinned image reference, not a moving tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # gh release create
  packages: write   # ghcr.io push

env:
  HOME: /home/runner
  GOCACHE: /home/runner/.cache/go-build
  GOMODCACHE: /home/runner/go/pkg/mod

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, smoothnas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: wrapper tests
        working-directory: wrapper
        run: |
          go vet ./...
          go test ./...

  publish:
    needs: test
    runs-on: [self-hosted, Linux, X64, smoothnas]
    continue-on-error: ${{ matrix.variant.name == 'cuda' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: cuda
            backend: cuda
            build_base: nvidia/cuda:12.8.1-devel-ubuntu24.04
            runtime_base: nvidia/cuda:12.8.1-runtime-ubuntu24.04
          - name: vulkan
            backend: vulkan
            build_base: ubuntu:24.04
            runtime_base: ubuntu:24.04
          - name: cpu
            backend: cpu
            build_base: ubuntu:24.04
            runtime_base: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@latest

      - name: Login to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: $HOME/go/bin/crane auth login ghcr.io -u "$GHCR_USER" -p "$GHCR_TOKEN"

      # GHCR rejects uppercase tags ("repository name must be lowercase").
      # The org slug is `RakuenSoftware` in github.repository, so we
      # lowercase the whole reference before passing it to Docker.
      - name: Compute lowercase image ref
        id: image
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ steps.version.outputs.version }}-${{ matrix.variant.name }}" >> "$GITHUB_OUTPUT"

      - name: Build + push (${{ matrix.variant.name }})
        run: |
          set -euo pipefail
          ref="${{ steps.image.outputs.ref }}"
          (
            cd wrapper
            CGO_ENABLED=0 go build -ldflags="-s -w" -o ../smoothnas-wrapper .
          )
          REF="$ref" \
            LLAMA_BACKEND="${{ matrix.variant.backend }}" \
            LLAMA_BUILD_BASE="${{ matrix.variant.build_base }}" \
            LLAMA_RUNTIME_BASE="${{ matrix.variant.runtime_base }}" \
            ./scripts/release-docker-commit.sh
          archive="image-${{ matrix.variant.name }}.tar"
          docker save "$ref" -o "$archive"
          $HOME/go/bin/crane push "$archive" "$ref"
          digest="$($HOME/go/bin/crane digest "$ref")"
          if [ -z "$digest" ]; then
            echo "crane digest did not return an image digest" >&2
            exit 1
          fi
          echo "$digest" > "digest-${{ matrix.variant.name }}.txt"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant.name }}
          path: digest-${{ matrix.variant.name }}.txt
          if-no-files-found: error

  release:
    needs: publish
    runs-on: [self-hosted, Linux, X64, smoothnas]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download pushed-image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true

      - name: Render manifests with pinned digests
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p release
          found=0
          for digest_file in digest-*.txt; do
            [ -e "$digest_file" ] || continue
            variant="${digest_file#digest-}"
            variant="${variant%.txt}"
            src="smoothnas-plugin.yaml"
            if [ "$variant" != "cuda" ]; then
              src="smoothnas-plugin-${variant}.yaml"
            fi
            digest="$(cat "$digest_file")"
            if [ -z "$digest" ]; then
              echo "missing digest for $variant" >&2
              exit 1
            fi
            out="release/$(basename $src)"
            image="ghcr.io/rakuensoftware/smoothnas-plugin-llama-cpp:${version}-${variant}"
            # Release manifests are the installable artifacts: set the
            # manifest version and pin the image to the exact digest that
            # docker push returned. Keep the tag in artifact.image for human
            # readability, and write the digest to artifact.digest so
            # SmoothNAS can pull repository@digest without handing skopeo the
            # unsupported repository:tag@digest form.
            python3 - "$src" "$out" "$version" "$image" "$digest" <<'EOF'
          import re
          import sys

          src, out, version, image, digest = sys.argv[1:]
          with open(src, encoding="utf-8") as f:
              manifest = f.read()

          manifest = re.sub(
              r'(?m)^(\s*version:\s*)[^\s#]+(\s*#.*)?$',
              rf'\g<1>{version}\2',
              manifest,
              count=1,
          )
          manifest = re.sub(
              r'(?m)^(\s*image:\s*)ghcr\.io/rakuensoftware/smoothnas-plugin-llama-cpp:[^\s#]+(?:@sha256:[0-9a-f]+)?(\s*#.*)?$',
              rf'\g<1>{image}\2',
              manifest,
              count=1,
          )
          digest_re = re.compile(r'(?m)^(\s*)digest:\s*sha256:[0-9a-f]+(\s*#.*)?$')
          if digest_re.search(manifest):
              manifest = digest_re.sub(rf'\g<1>digest: {digest}\2', manifest, count=1)
          else:
              manifest = re.sub(
                  r'(?m)^(\s*image:\s*[^\n]*\n)',
                  rf'\1  digest: {digest}\n',
                  manifest,
                  count=1,
              )

          with open(out, "w", encoding="utf-8") as f:
              f.write(manifest)
          EOF
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "no publish digests were downloaded" >&2
            exit 1
          fi
          ls -l release/

      - name: Render index.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          from pathlib import Path

          variants = []
          release_dir = Path("release")
          variant_meta = {
              "cuda": ("smoothnas-plugin.yaml", "gpu-nvidia"),
              "vulkan": ("smoothnas-plugin-vulkan.yaml", "gpu-amd"),
              "cpu": ("smoothnas-plugin-cpu.yaml", "none"),
          }
          for name, (manifest, profile) in variant_meta.items():
              if (release_dir / manifest).exists():
                  variants.append({"name": name, "manifest": manifest, "profile": profile})

          index = {"plugin": "llama-cpp", "version": os.environ["VERSION"], "variants": variants}
          (release_dir / "index.json").write_text(json.dumps(index, indent=2) + "\n", encoding="utf-8")
          EOF

      # release-please created the GitHub release with its own
      # conventional-commit-derived notes when the release PR merged.
      # We just attach the digest-pinned manifests + index as release
      # assets. generate_release_notes is left at its default (false)
      # so we don't overwrite release-please's notes.
      - name: Attach manifests to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
